<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Lär dig Malmö</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="description" content="Lär dig var Malmös namn ligger. Fungerar offline.">
<meta name="theme-color" content="#f8f4f0">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="map"></div>

<!-- The front door: the city in two halves — the names Malmö expects of you and
     everything else — and a row per kind inside each, with a bar saying how
     much of it you can already place. Everything else on this page is either a
     round in progress or the map you go and study on. -->
<div id="learn" hidden>
  <header id="learnhead">
    <div>
      <!-- Two ways to be asked about the same city, so the choice sits above the
           heading rather than inside one of them. Duplicated in #photostart
           because the two front doors are siblings and neither contains the
           other; one handler in app.js wires every .modetab there is. -->
      <nav class="modetabs" aria-label="Läge">
        <button class="modetab" type="button" data-mode="learn" aria-current="page">Öva</button>
        <button class="modetab" type="button" data-mode="photos">Förr</button>
      </nav>
      <h1>Lär dig Malmö</h1>
      <p>Placera namnen på kartan. Kartan är avskalad från text medan du gissar —
         annars vore det ett lästest.</p>
      <p id="learnsub"></p>
    </div>
    <button id="toexplore" type="button">Utforska kartan</button>
  </header>
  <div id="roundlist"></div>
  <footer id="learnfoot">
    <button id="forget" type="button">Glöm allt jag lärt mig</button>
  </footer>
</div>

<!-- The other front door. Öva asks where a name is; this asks when a photograph
     was taken and where the photographer stood, which is the same city read the
     other way round. -->
<div id="photostart" hidden>
  <header id="photohead">
    <div>
      <nav class="modetabs" aria-label="Läge">
        <button class="modetab" type="button" data-mode="learn">Öva</button>
        <button class="modetab" type="button" data-mode="photos" aria-current="page">Förr</button>
      </nav>
      <h1>Förr</h1>
      <p>Fem fotografier ur Malmö Museers samlingar. Gissa vilket år de togs och
         var fotografen stod. Samma fem för alla, hela dagen.</p>
      <p id="photosub"></p>
    </div>
    <button id="photoexplore" type="button">Utforska kartan</button>
  </header>
  <div id="photobody">
    <p id="photoday"></p>
    <p id="photostats"></p>
    <button id="photobegin" type="button">Spela dagens fem</button>
  </div>
</div>

<!-- A day in progress. The map underneath is blind, for the reason it is blind
     in a round: recognising the crane and knowing where it stands are two
     different things, and a labelled map only tests the first. -->
<div id="photoplay" hidden>
  <div id="photobar">
    <button id="photoquit" type="button" aria-label="Avsluta dagen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <p id="photoprompt"></p>
    <span id="phototally"></span>
  </div>

  <!-- The photograph and the two controls that answer it. On a phone the picture
       and the map want the same screen, so the picture folds away to a strip. -->
  <div id="shot">
    <button id="shottoggle" type="button" aria-label="Visa eller dölj fotografiet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <figure id="shotfigure">
      <img id="shotimage" alt="">
    </figure>

    <div id="shotask">
      <label for="yearpick">Vilket år?</label>
      <output id="yearvalue" for="yearpick"></output>
      <input id="yearpick" type="range" step="1">
      <button id="photoguess" type="button" disabled>Peka på kartan först</button>
    </div>

    <div id="shotresult" role="status" hidden>
      <p id="resultyear"></p>
      <p id="resultplace"></p>
      <p id="resultpoints"></p>
      <h2 id="resultplacename"></h2>
      <p id="resultcaption"></p>
      <p id="resultcredit"></p>
      <a id="resultsource" target="_blank" rel="noopener">Källa</a>
      <button id="photonext" type="button">Nästa bild</button>
    </div>
  </div>
</div>

<!-- The day, once all five are done. -->
<div id="photosummary" hidden>
  <p id="summaryday"></p>
  <h2 id="summaryscore"></h2>
  <ul id="photosummarylist"></ul>
  <button id="photosummarydone" type="button">Klart</button>
</div>

<!-- A round in progress. The map underneath is blind: no labels anywhere, only
     the outlines of whatever is being asked about. -->
<div id="play" hidden>
  <div id="playbar">
    <button id="quit" type="button" aria-label="Avsluta rundan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <p id="prompt"></p>
    <span id="tally"></span>
  </div>

  <p id="verdict" role="status" hidden></p>

  <!-- The point of the app: the name has just become a place, so say something
       about the place, and show it. A panel down the right on anything wide
       enough to spare the room, a sheet along the bottom on a phone — the map
       is the thing being learned, so the card takes an edge rather than the
       middle. -->
  <div id="factcard" hidden>
    <p id="factverdict"></p>
    <h2 id="factname"></h2>
    <p id="factmeta"></p>
    <!-- Hidden unless the item actually has a picture, which most do not; an
         empty frame says "missing" where nothing should be said at all. -->
    <figure id="factfigure" hidden>
      <img id="factimage" alt="">
      <figcaption id="factcredit"></figcaption>
    </figure>
    <p id="facttext"></p>
    <a id="factsource" target="_blank" rel="noopener" hidden>Källa</a>
    <button id="next" type="button">Nästa</button>
  </div>

  <div id="summary" hidden>
    <h2 id="summaryhead"></h2>
    <p id="summarysub"></p>
    <ul id="summarylist"></ul>
    <div class="summaryactions">
      <button id="summaryagain" type="button">En gång till</button>
      <button id="summarydone" type="button">Klart</button>
    </div>
  </div>
</div>

<!-- Search: the one place the app accepts text. Results are the whole UI.
     It belongs to the explore map only — inside a round it would be the answer
     key, so app.js hides this bar with the rest of the study chrome. -->
<div id="searchbar" hidden>
  <form id="searchform" autocomplete="off" role="search">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    <input id="q" type="search" placeholder="Sök gata, plats, område" aria-label="Sök"
           enterkeyhint="search" spellcheck="false">
    <button id="clear" type="button" aria-label="Rensa sökning" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </form>
  <ul id="results" role="listbox" hidden></ul>
</div>

<!-- Selected feature: name, what it is, which district. Nothing actionable. -->
<div id="card" hidden>
  <button id="cardclose" aria-label="Stäng">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <h2 id="cardname"></h2>
  <p id="cardmeta"></p>
  <p id="carddesc"></p>
</div>

<!-- Layers: nothing point-shaped is drawn until one of these asks for it.
     The chips are built from app/categories.mjs, which is the only place the
     list of them exists. The list starts closed — and closed means `hidden`,
     not merely off screen, so a chip you cannot see cannot be tabbed to.
     Last of the panels, so an open menu covers the card rather than the card
     covering the menu. -->
<nav id="layers" aria-label="Lager" hidden>
  <button id="layerstoggle" type="button" aria-expanded="false" aria-controls="chips">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 3 8.5l9 5 9-5zM3 15.5l9 5 9-5"/></svg>
    <span>Lager</span>
  </button>
  <div id="chips" hidden></div>
</nav>

<!-- The way back from studying to being asked. -->
<button id="tolearn" type="button" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h6a2 2 0 0 1 2 2v11a2 2 0 0 0-2-2H4zM20 5.5h-6a2 2 0 0 0-2 2v11a2 2 0 0 1 2-2h6z"/></svg>
  <span>Öva</span>
</button>

<div id="boot"><p id="bootmsg">Laddar kartan…</p></div>

<script src="/vendor/pmtiles.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
