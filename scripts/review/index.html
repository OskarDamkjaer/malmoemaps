<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Granska foton — Förr</title>

<!--
  The hand pass, as a page.

  Every photograph in game/photos.json got its year and its pin from a catalogue
  description or a camera's GPS, and neither of those knows whether the picture
  is any good as a question. The archives are full of interiors, trade-fair
  stands, copy work and photographs geotagged where the photographer was sitting
  rather than where they were pointing — and none of that is visible in the
  metadata. It is instantly visible in the picture.

  So: one photograph at a time, as big as the window allows, with the two things
  being claimed about it (the year, the place) next to it, and one key to keep it
  and one to throw it away. Decisions go to the dev server after every keystroke,
  so closing the tab loses nothing.

  Dev only. Served by scripts/serve.mjs at /review/, never built into the site.
-->

<style>
  :root {
    --bg: #16140f;
    --panel: #211e18;
    --ink: #f2ede6;
    --ink-soft: #a49c8f;
    --line: #35312a;
    --keep: #4d9a72;
    --drop: #c2543a;
    --accent: #d9a441;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-columns: 1fr 340px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  }

  /* ---- the picture ---- */
  #stage {
    position: relative;
    display: grid;
    place-items: center;
    padding: 16px;
    min-width: 0;
    min-height: 0;
  }
  #shot {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 8px 40px rgb(0 0 0 / 55%);
    background: #000;
  }
  #verdictflash {
    position: absolute;
    inset: 16px;
    border-radius: 6px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .12s;
  }
  #verdictflash[data-v="keep"] { box-shadow: inset 0 0 0 5px var(--keep); opacity: 1; }
  #verdictflash[data-v="drop"] { box-shadow: inset 0 0 0 5px var(--drop); opacity: 1; }

  /* ---- the claims ---- */
  #side {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 18px;
    background: var(--panel);
    border-left: 1px solid var(--line);
    overflow-y: auto;
  }
  @media (max-width: 800px) { #side { border-left: 0; border-top: 1px solid var(--line); } }

  #count { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  #bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  #bar div { height: 100%; background: var(--accent); transition: width .15s; }

  #year { font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  #place { font-size: 17px; color: var(--accent); }
  #caption { font-size: 14px; }
  #credit, #meta { font-size: 11px; color: var(--ink-soft); }
  #source { font-size: 12px; color: var(--ink-soft); }

  /* Where the pin is, against every other pin in the set. The cloud of grey
     dots draws the shape of the city for free, so a photograph of Limhamn
     pinned out in Husie is obvious without a basemap. */
  #locator { width: 100%; background: #100e0a; border: 1px solid var(--line); border-radius: 4px; }

  #tally { display: flex; gap: 14px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .k { color: var(--keep); }
  .d { color: var(--drop); }
  .s { color: var(--ink-soft); }

  #buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
  button {
    padding: 11px 10px;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: #2c2820;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: #383226; }
  #keep { border-color: var(--keep); }
  #drop { border-color: var(--drop); }
  #buttons .wide { grid-column: 1 / -1; }
  kbd {
    font: inherit; font-size: 11px;
    padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px;
    color: var(--ink-soft);
  }
  #saved { font-size: 11px; color: var(--ink-soft); min-height: 1.2em; }
  #done { padding: 20px; text-align: center; }
  a { color: var(--accent); }
</style>

<div id="stage">
  <img id="shot" alt="">
  <div id="verdictflash"></div>
</div>

<div id="side">
  <div id="count"></div>
  <div id="bar"><div></div></div>

  <div id="year"></div>
  <div id="place"></div>
  <div id="caption"></div>
  <svg id="locator" viewBox="0 0 360 170" aria-hidden="true"></svg>
  <div id="meta"></div>
  <div id="credit"></div>
  <a id="source" target="_blank" rel="noopener">Källa ↗</a>

  <div id="tally"></div>
  <div id="saved"></div>

  <div id="buttons">
    <button id="keep">Behåll <kbd>→</kbd></button>
    <button id="drop">Kasta <kbd>←</kbd></button>
    <button id="back" class="wide">Ångra senaste <kbd>U</kbd></button>
  </div>
</div>

<script type="module">
const el = (id) => document.getElementById(id);

const game = await fetch('/data/game.json').then((r) => r.json());
const photos = game.photos;

// Decisions already made, so this is resumable — the whole point of saving after
// every keystroke is that five hundred photographs is more than one sitting.
let decisions = await fetch('/review/state').then((r) => r.json()).catch(() => ({}));

// Start wherever the reviewing stopped rather than at the beginning.
let at = photos.findIndex((p) => !decisions[p.id]);
if (at < 0) at = photos.length;
const history = [];

// ---- the locator ----
// Drawn once for the grey cloud, then one red dot moved per photograph.
const W = 360; const H = 170; const PAD = 6;
const bounds = photos.reduce((b, p) => ({
  w: Math.min(b.w, p.point[0]), e: Math.max(b.e, p.point[0]),
  s: Math.min(b.s, p.point[1]), n: Math.max(b.n, p.point[1]),
}), { w: 1e9, e: -1e9, s: 1e9, n: -1e9 });
const px = ([lng, lat]) => [
  PAD + ((lng - bounds.w) / (bounds.e - bounds.w || 1)) * (W - 2 * PAD),
  // Latitude grows upward and SVG y grows downward.
  PAD + (1 - (lat - bounds.s) / (bounds.n - bounds.s || 1)) * (H - 2 * PAD),
];
const svg = el('locator');
const ns = 'http://www.w3.org/2000/svg';
for (const p of photos) {
  const [x, y] = px(p.point);
  const c = document.createElementNS(ns, 'circle');
  c.setAttribute('cx', x.toFixed(1));
  c.setAttribute('cy', y.toFixed(1));
  c.setAttribute('r', '1.6');
  c.setAttribute('fill', '#4a443a');
  svg.append(c);
}
const here = document.createElementNS(ns, 'circle');
here.setAttribute('r', '5');
here.setAttribute('fill', '#c2543a');
here.setAttribute('stroke', '#fff');
here.setAttribute('stroke-width', '1.5');
svg.append(here);

// ---- saving ----
let saveTimer = 0;
let pending = false;
function save() {
  pending = true;
  el('saved').textContent = 'sparar…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await fetch('/review/state', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(decisions),
      });
      pending = false;
      el('saved').textContent = `sparat i game/review.json · ${Object.keys(decisions).length} beslut`;
    } catch (err) {
      el('saved').textContent = `KUNDE INTE SPARA: ${err.message}`;
    }
  }, 250);
}
// A decision made and not yet flushed should not be lost to a closed tab.
addEventListener('beforeunload', (e) => { if (pending) e.preventDefault(); });

// ---- rendering ----
function render() {
  const kept = Object.values(decisions).filter((d) => d === 'keep').length;
  const dropped = Object.values(decisions).filter((d) => d === 'drop').length;
  el('tally').innerHTML = `<span class="k">✓ ${kept} behållna</span>`
    + `<span class="d">✕ ${dropped} kastade</span>`
    + `<span class="s">${photos.length - kept - dropped} kvar</span>`;
  el('bar').firstElementChild.style.width = `${((kept + dropped) / photos.length) * 100}%`;

  if (at >= photos.length) {
    el('stage').innerHTML = '<div id="done"><h1>Klart</h1>'
      + `<p>${kept} behållna, ${dropped} kastade.</p>`
      + '<p>Kör <code>node scripts/apply-review.mjs</code> och sedan '
      + '<code>node scripts/build-game.mjs</code>.</p></div>';
    el('year').textContent = '';
    el('place').textContent = '';
    el('caption').textContent = '';
    el('meta').textContent = '';
    el('credit').textContent = '';
    el('source').hidden = true;
    return;
  }

  const p = photos[at];
  el('count').textContent = `${at + 1} av ${photos.length}`;
  el('shot').src = p.image;
  el('shot').alt = p.caption ?? '';
  el('year').textContent = p.year;
  el('place').textContent = p.place ?? '(ingen plats angiven)';
  el('caption').textContent = p.caption ?? '';
  el('meta').textContent = `${p.id} · ${p.point[1].toFixed(4)}, ${p.point[0].toFixed(4)}`;
  el('credit').textContent = p.credit;
  el('source').href = p.source;
  el('source').hidden = false;
  const [x, y] = px(p.point);
  here.setAttribute('cx', x.toFixed(1));
  here.setAttribute('cy', y.toFixed(1));
}

let flashTimer = 0;
function decide(verdict) {
  if (at >= photos.length) return;
  decisions[photos[at].id] = verdict;
  history.push(photos[at].id);
  const flash = el('verdictflash');
  flash.dataset.v = verdict;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { delete flash.dataset.v; }, 140);
  at += 1;
  save();
  render();
}

function undo() {
  const last = history.pop();
  if (!last) return;
  delete decisions[last];
  at = photos.findIndex((p) => p.id === last);
  save();
  render();
}

el('keep').addEventListener('click', () => decide('keep'));
el('drop').addEventListener('click', () => decide('drop'));
el('back').addEventListener('click', undo);

addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const key = e.key.toLowerCase();
  if (e.key === 'ArrowRight' || key === 'k') { e.preventDefault(); decide('keep'); }
  else if (e.key === 'ArrowLeft' || key === 'x') { e.preventDefault(); decide('drop'); }
  else if (key === 'u') { e.preventDefault(); undo(); }
  // Look without judging: useful for a first pass through a decade.
  else if (e.key === 'ArrowDown' || key === 'j') { e.preventDefault(); at = Math.min(at + 1, photos.length); render(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); at = Math.max(at - 1, 0); render(); }
});

render();
el('saved').textContent = Object.keys(decisions).length
  ? `återupptar · ${Object.keys(decisions).length} beslut sedan tidigare`
  : 'inga beslut än';
</script>
