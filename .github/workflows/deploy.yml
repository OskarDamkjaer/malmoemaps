# Build the site and publish it to GitHub Pages.
#
# This is the whole deploy. There is no build server and no laptop in the loop:
# push to main, or run this workflow by hand, and the published site is what
# main says it should be.
#
# The heavy half of the data pipeline (a 772 MB OSM extract, osmium, Planetiler)
# does not run here and never will — it produces the basemap, which changes
# about as often as Malmö does. What it produces is carried by the release asset
# that scripts/fetch-dev-assets.mjs unpacks, the same asset a web sandbox uses.
# Everything downstream of that is rebuilt here, so nothing derived is trusted
# from the asset.
#
# Pages serves the site at the root of a custom domain rather than at
# /malmoemaps/, because the app addresses itself with root-absolute paths
# (/app.css, /style.json, /malmo.pmtiles). A project path would 404 on all of
# them. The domain is set in the repo's Pages settings, not here.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repo and the release asset; mint the token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# A deploy that is already running is a deploy of older code.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Generated data, the basemap, glyphs and sprite: the four things that
      # cannot be rebuilt without the heavy pipeline. Checksum-verified.
      - name: Fetch the assets the pipeline cannot rebuild here
        run: node scripts/fetch-dev-assets.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # maplibre + pmtiles, at the versions the repo pins.
      - name: Fetch vendored runtime assets
        run: node scripts/fetch-app-assets.mjs

      - name: Draw the home-screen icons
        run: node scripts/build-icons.mjs

      - name: Build the map style
        run: node scripts/build-style.mjs

      # Rebuilt rather than taken from the asset: learn.json is derived, and a
      # derived file shipped in an asset is a copy that can fall behind the
      # sources it came from. Rebuilding here means the deployed quiz is what
      # this commit's data says it is.
      - name: Rebuild the derived quiz data
        run: node scripts/build-learn.mjs

      # Nothing else runs these, so they gate the deploy.
      - name: Test
        run: node --test 'test/*.test.mjs'

      - name: Assemble the site
        run: node scripts/build-site.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
